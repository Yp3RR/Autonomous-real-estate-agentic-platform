<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connect Your Calendar</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #0f0f0f;
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        .card {
            background: #1a1a1a;
            border: 1px solid #2a2a2a;
            border-radius: 16px;
            padding: 48px 40px;
            text-align: center;
            max-width: 420px;
            width: 90%;
        }

        .icon {
            font-size: 48px;
            margin-bottom: 24px;
        }

        h1 {
            font-size: 22px;
            font-weight: 600;
            margin-bottom: 12px;
        }

        p {
            color: #888;
            font-size: 14px;
            line-height: 1.6;
            margin-bottom: 32px;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            background: #fff;
            color: #000;
            padding: 14px 28px;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 500;
            text-decoration: none;
            transition: opacity 0.2s;
        }

        .btn:hover { opacity: 0.85; }

        .btn img {
            width: 20px;
            height: 20px;
        }

        .note {
            margin-top: 24px;
            font-size: 12px;
            color: #555;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="icon">📅</div>
        <h1>Connect Your Google Calendar</h1>
        <p>Allow the AI agent to check availability and book appointments directly into your calendar — automatically, 24/7.</p>
        <a href="/auth/google" class="btn">
            <img src="https://www.google.com/favicon.ico" alt="Google">
            Connect with Google
        </a>
        <p class="note">You can disconnect at any time from your Google account settings.</p>
    </div>
</body>
</html>
