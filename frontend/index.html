<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Northstar One — Sector 79, Gurugram</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>

  <!-- HEADER -->
  <header>
    <div class="logo">Northstar One</div>
    <nav>
      <a href="#about">About</a>
      <a href="#chat">Talk to Dhruv</a>
    </nav>
  </header>

  <!-- HERO -->
  <section id="hero">
    <h1>Northstar One</h1>
    <p class="tagline">Sector 79, Gurugram</p>
    <div class="stats">
      <div class="stat"><span class="value">2BHK</span><span class="label">from ₹1.35 Cr</span></div>
      <div class="stat"><span class="value">3BHK</span><span class="label">from ₹1.75 Cr</span></div>
      <div class="stat"><span class="value">RERA</span><span class="label">Registered</span></div>
    </div>
  </section>

  <!-- CHAT -->
  <section id="chat">
    <h2>Talk to Dhruv</h2>
    <p>Your AI sales advisor, available 24/7.</p>

    <div id="chat-window">
      <div id="messages">
        <!-- messages go here -->
      </div>
      <div id="input-bar">
        <input type="text" id="user-input" placeholder="Ask anything about Northstar One..." />
        <button id="send-btn">Send</button>
      </div>
    </div>
  </section>

  <!-- FOOTER -->
  <footer>
    <p>© 2026 Northstar One. All rights reserved.</p>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="/static/app.js"></script>
</body>
</html>
